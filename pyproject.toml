[project]
name = "omegaconf-extra-resolvers"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [{ name = "rmpIGN" }]
requires-python = ">=3.12"
dependencies = ["omegaconf>=2.3.1"]

[build-system]
requires = ["uv_build>=0.12.4,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = ["ruff>=0.16.3", "pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
select = ["C", "E", "F", "W", "I"]

[tool.ruff.isort]
force-single-line = true

[tool.ruff.pydocstyle]
convention = "numpy"
